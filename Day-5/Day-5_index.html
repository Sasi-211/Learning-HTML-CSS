<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Day-5_style.css">
</head>
<body>
    <h2>Forms in HTML</h2>

    <form>
        <input type="text" placeholder="Enter Username" required>
        <input type="password" placeholder="enter password" required>
        <input type="submit" value="LogIn">

        <input type="date">
        <input type="datetime-local">
        <input type="color">
        <input type="number">


        <h3>Gender</h3>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="others">
        <label for="others">Others</label>


        <h3>Hobbies</h3>

        <input type="checkbox" name="hobbies" id="eating">
        <label for="eating">Eating</label>

        <input type="checkbox" name="hobbies" id="roaming">
        <label for="roaming">Roaming</label>

        <input type="checkbox" name="hobbies" id="sleeping">
        <label for="sleeping">Sleeping</label>

        <!-- Dropdowns -->
        <select name="" id="">
            <option value="">Telugu</option>
            <option value="">English</option>
            <option value="">Hindi</option>
        </select>

        <textarea name="" id="" cols="30" rows="10"></textarea>


    </form>
    
</body>
</html>
